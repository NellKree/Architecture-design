name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - LabWork5  # Замени на свою ветку

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'

    - name: Install dependencies for text-analysis
      run: |
        pip install -r text-analysis-service/requirements.txt
        python -m unittest discover text-analysis-service

    - name: Install dependencies for network-analysis
      run: |
        pip install -r network-analysis-service/requirements.txt
        python -m unittest discover network-analysis-service

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Build and start services
      run: |
        docker-compose up -d
        sleep 10  # Даем время сервисам запуститься

    - name: Run integration tests
      run: |
        pip install requests
        python -m unittest discover tests

    - name: Stop containers
      run: docker-compose down

  build:
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Build Docker images
      run: |
        docker build -t text-analysis ./text-analysis-service
        docker build -t network-analysis ./network-analysis-service

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/user/bot-detection
          git pull origin main
          docker-compose down
          docker-compose up --build -d
