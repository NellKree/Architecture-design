name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'

    - name: Install dependencies for text-analysis
      run: |
        pip install -r text-analysis-service/requirements.txt
        python -m unittest discover text-analysis-service

    - name: Install dependencies for network-analysis
      run: |
        pip install -r network-analysis-service/requirements.txt
        python -m unittest discover network-analysis-service

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build text-analysis service
      run: docker build -t text-analysis ./text-analysis-service

    - name: Build network-analysis service
      run: docker build -t network-analysis ./network-analysis-service
